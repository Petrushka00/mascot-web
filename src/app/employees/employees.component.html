<div class="employees-page content-body">
  <div class="page-header page-title-row">
    <div>
      <h1>Сотрудники MASCOT</h1>
      <p class="subtitle">Управление и оценка персонала</p>
    </div>
    <div class="employees-count">
      Всего сотрудников:
      <strong>{{ totalEmployees() }}</strong>
    </div>
  </div>

  <app-active-employees-filter [(checked)]="onlyActive">
  </app-active-employees-filter>

  <div class="employees-table-header">
    <span>ID</span>
    <span>ФИО</span>
    <span>Должность</span>
    <span>Отдел</span>
    <span>Статус</span>
    <span style="text-align: right; padding-right: 15px;">Оценка</span>
  </div>

  <div class="employees-grid">
    @for (employee of visibleEmployees(); track employee.id) {
      <app-employee-card
        [employee]="employee"
        (archive)="archiveEmployee($event)">
        <span card-extra>Доп. информация</span>
      </app-employee-card>
    } @empty {
      <p class="subtitle">Сотрудники не найдены.</p>
    }
  </div>
</div>
